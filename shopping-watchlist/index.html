<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Sniper Watchlist</title>
    
    <!-- Tailwind CSS for Premium UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f1f5f9; }
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased p-4 md:p-8">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Premium Single-Source Chart Component ---
        const SourceChart = ({ history, sourceId, sourceName, color = '#4f46e5' }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                const ctx = chartRef.current.getContext('2d');
                
                const gradient = ctx.createLinearGradient(0, 0, 0, 150);
                gradient.addColorStop(0, color + '4D'); 
                gradient.addColorStop(1, color + '00'); 

                const validHistory = history.filter(h => h[sourceId] !== undefined && h[sourceId] !== null);

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: validHistory.map(h => h.date),
                        datasets: [{
                            label: `${sourceName} Price`,
                            data: validHistory.map(h => h[sourceId]),
                            borderColor: color,
                            backgroundColor: gradient,
                            borderWidth: 2.5,
                            pointBackgroundColor: color,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            tension: 0.35,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                callbacks: {
                                    label: function(context) {
                                        return ' ' + new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' }).format(context.parsed.y);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                            y: { 
                                ticks: { 
                                    font: { size: 10 },
                                    callback: function(value) { return '$' + value; }
                                }
                            }
                        }
                    }
                });

                return () => { if (chartInstance.current) chartInstance.current.destroy(); }
            }, [history, sourceId, sourceName]);

            return <div className="h-36 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        // --- Master Product Row Component ---
        const ProductRow = ({ item }) => {
            const [expanded, setExpanded] = useState(false);
            
            if (!item.sources || item.sources.length === 0) return null;

            // Automatically calculate the absolute best deal right now
            const bestSource = item.sources.reduce((min, s) => 
                s.current_total_price < min.current_total_price ? s : min, 
                item.sources[0]
            );

            const colors = ['#4f46e5', '#06b6d4', '#f59e0b'];

            return (
                <React.Fragment>
                    {/* Clean Executive Summary Line */}
                    <tr 
                        className={`cursor-pointer transition-all border-b border-slate-200/80 hover:bg-slate-50/80 ${expanded ? 'bg-indigo-50/40' : 'bg-white'}`}
                        onClick={() => setExpanded(!expanded)}
                    >
                        <td className="px-6 py-4">
                            <div className="flex items-center gap-4">
                                <span className={`text-slate-400 transition-transform duration-200 flex-shrink-0 ${expanded ? 'rotate-90 text-indigo-600' : ''}`}>
                                    ▶
                                </span>
                                
                                {/* Image Thumbnail Wrapper */}
                                {item.image_url ? (
                                    <img 
                                        src={item.image_url} 
                                        alt={item.product_name} 
                                        className="w-12 h-12 object-contain rounded-xl bg-white border border-slate-200 p-1 flex-shrink-0 shadow-sm"
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                ) : (
                                    <div className="w-12 h-12 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center flex-shrink-0 text-slate-400 text-lg">
                                        📦
                                    </div>
                                )}

                                <div className="font-semibold text-slate-900 text-base">
                                    {item.product_name}
                                </div>
                            </div>
                        </td>
                        <td className="px-6 py-4 vertical-align-middle">
                            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                                🏬 {bestSource.source_name}
                            </span>
                        </td>
                        <td className="px-6 py-4 text-right">
                            <span className="text-lg font-bold text-emerald-600">
                                A$ {bestSource.current_total_price.toFixed(2)}
                            </span>
                        </td>
                    </tr>

                    {/* Deep-Dive Sub-Rows Grid */}
                    {expanded && (
                        <tr className="bg-slate-50/50 border-b border-slate-200">
                            <td colSpan="3" className="px-8 py-6">
                                <div className="mb-4 flex items-center justify-between">
                                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">All Tracked Outlets for this item</h3>
                                    <span className="text-xs text-slate-400">Date Added: {item.date_added}</span>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {item.sources.map((source, idx) => {
                                        const isWinner = source.source_id === bestSource.source_id;
                                        return (
                                            <div 
                                                key={source.source_id} 
                                                className={`bg-white rounded-xl p-5 border shadow-sm flex flex-col justify-between transition-all ${isWinner ? 'border-emerald-500 ring-2 ring-emerald-500/10' : 'border-slate-200'}`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <h4 className="font-bold text-slate-900 text-base flex items-center gap-1.5">
                                                            {source.source_name}
                                                            {isWinner && <span className="text-xs text-emerald-600 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">⭐ BEST</span>}
                                                        </h4>
                                                        <p className="text-xs text-slate-400 capitalize mt-0.5">Fulfillment: {source.fulfillment_type.replace('_', ' ')}</p>
                                                    </div>
                                                    <a 
                                                        href={source.product_url} 
                                                        target="_blank" 
                                                        className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg transition-colors"
                                                    >
                                                        Buy Link ↗
                                                    </a>
                                                </div>

                                                <div className="flex gap-4 border-t border-b border-slate-100 py-2.5 my-3 text-xs text-slate-500">
                                                    <div>Base: <span className="font-medium text-slate-700">${source.current_base_price.toFixed(2)}</span></div>
                                                    <div>Freight: <span className="font-medium text-slate-700">${source.fulfillment_cost.toFixed(2)}</span></div>
                                                    <div className="ml-auto font-bold text-sm text-slate-900">Total: ${source.current_total_price.toFixed(2)}</div>
                                                </div>

                                                <div className="mt-2">
                                                    <SourceChart 
                                                        history={item.price_history} 
                                                        sourceId={source.source_id} 
                                                        sourceName={source.source_name}
                                                        color={isWinner ? '#10b981' : colors[idx % colors.length]} 
                                                    />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </td>
                        </tr>
                    )}
                </React.Fragment>
            );
        };

        // --- Core Application Workspace ---
        const App = () => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const cacheBuster = new Date().getTime();
                fetch(`./watchlist.json?t=${cacheBuster}`)
                    .then(res => {
                        if (!res.ok) throw new Error('Failed to download watchlist schema.');
                        return res.json();
                    })
                    .then(jsonData => {
                        setData(jsonData);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="gradient-bg rounded-2xl p-6 md:p-8 text-white shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black tracking-tight">Watchlist Control Center</h1>
                            <p className="text-indigo-100/90 text-sm mt-1">Aggregated, localized price telemetry for Postcode 3810.</p>
                        </div>
                        {data && data.last_updated && (
                            <div className="bg-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-lg border border-white/20 text-xs font-semibold uppercase tracking-wider">
                                System Sync: {new Date(data.last_updated).toLocaleTimeString()}
                            </div>
                        )}
                    </div>

                    {loading && (
                        <div className="flex justify-center items-center py-24">
                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
                        </div>
                    )}

                    {error && (
                        <div className="bg-rose-50 border border-rose-200 text-rose-800 p-4 rounded-xl text-sm font-medium shadow-sm">
                            ⚠️ System Link Error: Check if data exists in watchlist.json ({error})
                        </div>
                    )}

                    {data && data.wishlist && data.wishlist.length === 0 && (
                        <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400 text-sm font-medium">
                            No items actively monitored. Instruct OpenClaw to begin target scanning.
                        </div>
                    )}

                    {data && data.wishlist && data.wishlist.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50 text-slate-400 text-xs font-bold uppercase tracking-wider">
                                    <tr>
                                        <th scope="col" className="px-6 py-4 text-left">Tracked Product</th>
                                        <th scope="col" className="px-6 py-4 text-left">Top Local Merchant</th>
                                        <th scope="col" className="px-6 py-4 text-right">Best Active Price</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200 bg-white">
                                    {data.wishlist.map(item => (
                                        <ProductRow key={item.id} item={item} />
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
