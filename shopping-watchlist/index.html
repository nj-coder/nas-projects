<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Sniper &#183; Watchlist</title>
<meta name="description" content="Localised price tracking for Pakenham VIC 3810.">
<link rel="icon" href="data:,">

<!-- Only dependency: Chart.js (used for the price-history sparklines; the page degrades gracefully if it fails to load). -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>

<style>
  :root{
    --bg:#f5f6fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --line:#e7e9f2; --line-soft:#eef0f7;
    --indigo:#4f46e5; --violet:#7c3aed; --indigo-soft:#eef2ff; --indigo-ink:#4338ca;
    --good:#059669; --good-soft:#ecfdf5; --good-line:#a7f3d0;
    --up:#e11d48; --up-soft:#fff1f2; --up-line:#fecdd3;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
    --shadow-lg:0 10px 40px -12px rgba(79,70,229,.25);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding:20px 16px 64px;
  }
  .wrap{max-width:1040px;margin:0 auto}

  /* Header */
  .hero{
    background:linear-gradient(135deg,var(--indigo) 0%,var(--violet) 100%);
    border-radius:22px; padding:26px 28px; color:#fff; box-shadow:var(--shadow-lg);
    display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
  }
  .hero h1{margin:0; font-size:clamp(22px,3.4vw,30px); font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:10px}
  .hero p{margin:6px 0 0; color:#e0e7ffd9; font-size:14px; font-weight:500}
  .sync{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(6px); padding:8px 14px; border-radius:12px; font-size:12.5px; font-weight:600;
    display:flex; gap:8px; align-items:center; white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; box-shadow:var(--shadow)}
  .stat .k{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint)}
  .stat .v{font-size:23px; font-weight:800; letter-spacing:-.02em; margin-top:4px}
  .stat .s{font-size:12.5px; color:var(--muted); margin-top:2px}

  /* Product cards */
  .list{display:flex; flex-direction:column; gap:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; transition:border-color .18s, box-shadow .18s}
  .card.open{border-color:#c7d2fe; box-shadow:var(--shadow-lg)}
  .head{
    width:100%; border:0; background:none; cursor:pointer; text-align:left; font:inherit; color:inherit;
    display:flex; align-items:center; gap:16px; padding:16px 18px;
  }
  .head:focus-visible{outline:2px solid var(--indigo); outline-offset:-2px; border-radius:var(--r)}
  .chev{flex:0 0 auto; color:var(--faint); font-size:20px; line-height:1; transition:transform .2s, color .2s}
  .card.open .chev{transform:rotate(90deg); color:var(--indigo)}
  .thumb{flex:0 0 auto; width:54px; height:54px; border-radius:13px; background:#fff; border:1px solid var(--line); object-fit:contain; padding:4px}
  .thumb.ph{display:flex; align-items:center; justify-content:center; font-size:22px; background:#f8fafc; color:var(--faint)}
  .meta{flex:1 1 auto; min-width:0}
  .name{font-weight:650; font-size:15.5px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
  .right{flex:0 0 auto; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
  .price{font-size:21px; font-weight:800; color:var(--good); letter-spacing:-.02em}
  .at{font-size:11.5px; color:var(--muted); margin-top:-3px}
  .chip{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid transparent}
  .chip.down{background:var(--good-soft); color:var(--good); border-color:var(--good-line)}
  .chip.up{background:var(--up-soft); color:var(--up); border-color:var(--up-line)}
  .chip.flat{background:#f1f5f9; color:var(--muted); border-color:var(--line)}

  /* Detail */
  .detail{border-top:1px solid var(--line-soft); padding:0 18px; max-height:0; opacity:0; overflow:hidden; transition:max-height .32s ease, opacity .26s, padding .32s}
  .card.open .detail{max-height:2200px; opacity:1; padding:18px 18px 22px}
  .detail-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap}
  .detail-top h3{margin:0; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--faint)}
  .detail-top .added{font-size:12px; color:var(--muted)}
  .sources{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px}
  .src{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px; display:flex; flex-direction:column}
  .src.best{border-color:var(--good); box-shadow:0 0 0 3px var(--good-soft)}
  .src-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .src-name{font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .badge{font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--good); background:var(--good-soft); border:1px solid var(--good-line); padding:2px 6px; border-radius:6px}
  .src-fulfil{font-size:11.5px; color:var(--faint); margin-top:2px; text-transform:capitalize}
  .buy{flex:0 0 auto; font-size:12px; font-weight:700; color:var(--indigo-ink); background:var(--indigo-soft); border:1px solid #e0e7ff; padding:6px 10px; border-radius:9px; text-decoration:none; transition:background .15s}
  .buy:hover{background:#e0e7ff}
  .breakdown{display:flex; gap:14px; align-items:baseline; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:10px 0; margin:12px 0; font-size:12px; color:var(--muted)}
  .breakdown b{color:var(--ink); font-weight:600}
  .breakdown .tot{margin-left:auto; font-size:13.5px; color:var(--ink); font-weight:800}
  .chartbox{position:relative; height:120px; margin-top:auto}
  .chart-na{height:120px; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:12px; background:#f8fafc; border-radius:10px; margin-top:auto}

  /* States */
  .state{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:48px 24px; text-align:center; color:var(--muted)}
  .spinner{width:38px;height:38px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:var(--up-soft); border-color:var(--up-line); color:#9f1239; text-align:left; padding:18px 20px}
  .err code{background:rgba(0,0,0,.05); padding:1px 6px; border-radius:5px; font-size:12.5px}

  @media (max-width:680px){
    .stats{grid-template-columns:1fr}
    .head{gap:12px; padding:14px}
    .thumb{width:46px;height:46px}
    .name{white-space:normal}
    .price{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div>Loading watchlist&#8230;</div>
</div>

<script>
(function(){
  "use strict";
  var app = document.getElementById('app');
  var charts = [];

  var fmtAUD = function(n){
    if (typeof n !== 'number' || isNaN(n)) return '&#8212;';
    return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(n);
  };
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fulfilLabel(t){
    return ({delivery:'Delivery', pickup:'Click & Collect', free_delivery:'Free delivery'})[t] || String(t||'').replace(/_/g,' ');
  }
  function num(x){ return typeof x === 'number' && !isNaN(x) ? x : 0; }

  function bestSource(item){
    return item.sources.reduce(function(m,s){
      return num(s.current_total_price) < num(m.current_total_price) ? s : m;
    }, item.sources[0]);
  }
  function dayMins(item){
    return (item.price_history||[]).map(function(h){
      var vals = Object.keys(h).filter(function(k){return k!=='date';}).map(function(k){return h[k];}).filter(function(v){return typeof v==='number';});
      return vals.length ? Math.min.apply(null, vals) : null;
    }).filter(function(v){return v!=null;});
  }
  function trend(item){
    var best = num(bestSource(item).current_total_price);
    var mins = dayMins(item);
    var first = mins.length ? mins[0] : best;
    var lowest = Math.min.apply(null, mins.concat([best]));
    var pct = first ? (best - first)/first*100 : 0;
    return {best:best, first:first, lowest:lowest, pct:pct};
  }
  function trendChip(t){
    if (t.pct <= -0.5) return '<span class="chip down" title="Cheaper than when first tracked">&#9660; '+Math.abs(t.pct).toFixed(0)+'% since added</span>';
    if (t.pct >=  0.5) return '<span class="chip up" title="More expensive than when first tracked">&#9650; '+t.pct.toFixed(0)+'% since added</span>';
    return '<span class="chip flat">&#9644; Stable</span>';
  }

  function render(data){
    charts.forEach(function(c){ try{c.destroy();}catch(e){} });
    charts = [];
    var items = (data && Array.isArray(data.wishlist)) ? data.wishlist.filter(function(it){ return it && it.sources && it.sources.length; }) : [];

    var synced = '';
    if (data && data.last_updated){
      var d = new Date(data.last_updated);
      if (!isNaN(d)) synced = d.toLocaleString('en-AU',{dateStyle:'medium', timeStyle:'short'});
    }

    // summary stats
    var basket = items.reduce(function(a,it){ return a + num(bestSource(it).current_total_price); }, 0);
    var saver = null;
    items.forEach(function(it){ var t = trend(it); if (saver===null || t.pct < saver.pct) saver = {name:it.product_name, pct:t.pct}; });

    var html = ''
      + '<div class="hero">'
      +   '<div><h1>&#127919; Price Sniper</h1><p>Localised price tracking &#183; Pakenham VIC 3810</p></div>'
      +   (synced ? '<div class="sync"><span class="dot"></span>Synced '+esc(synced)+'</div>' : '')
      + '</div>';

    if (items.length){
      html += '<div class="stats">'
        + '<div class="stat"><div class="k">Tracking</div><div class="v">'+items.length+'</div><div class="s">product'+(items.length===1?'':'s')+' watched</div></div>'
        + '<div class="stat"><div class="k">Best-price basket</div><div class="v">'+fmtAUD(basket)+'</div><div class="s">sum of cheapest options</div></div>'
        + '<div class="stat"><div class="k">Biggest saver</div><div class="v">'+(saver && saver.pct<-0.5 ? '&#9660; '+Math.abs(saver.pct).toFixed(0)+'%' : '&#8212;')+'</div><div class="s">'+esc(saver && saver.pct<-0.5 ? saver.name : 'no drops yet')+'</div></div>'
        + '</div>';

      html += '<div class="list">';
      items.forEach(function(it){
        var b = bestSource(it), t = trend(it);
        var thumb = it.image_url
          ? '<img class="thumb" src="'+esc(it.image_url)+'" alt="'+esc(it.product_name)+'" loading="lazy" onerror="this.outerHTML=&quot;<div class=\\&quot;thumb ph\\&quot;>&#128230;</div>&quot;">'
          : '<div class="thumb ph">&#128230;</div>';
        html += ''
          + '<div class="card" data-id="'+esc(it.id)+'">'
          +   '<button class="head" aria-expanded="false">'
          +     '<span class="chev">&#8250;</span>'
          +     thumb
          +     '<div class="meta"><div class="name">'+esc(it.product_name)+'</div>'
          +       '<div class="sub">'+it.sources.length+' outlet'+(it.sources.length===1?'':'s')+' &#183; lowest seen '+fmtAUD(t.lowest)+'</div></div>'
          +     '<div class="right"><div class="price">'+fmtAUD(b.current_total_price)+'</div>'
          +       '<div class="at">at '+esc(b.source_name)+'</div>'+trendChip(t)+'</div>'
          +   '</button>'
          +   '<div class="detail"></div>'
          + '</div>';
      });
      html += '</div>';
    } else if (data) {
      html += '<div class="state">&#128237; Nothing on the watchlist yet.<br><span style="font-size:13px">Ask OpenClaw to &#8220;add something to my shopping list&#8221;.</span></div>';
    }

    app.innerHTML = html;

    // wire expand/collapse (lazy-build detail + charts on first open)
    Array.prototype.forEach.call(app.querySelectorAll('.card'), function(card){
      var id = card.getAttribute('data-id');
      var item = items.filter(function(x){return String(x.id)===id;})[0];
      var head = card.querySelector('.head');
      var detail = card.querySelector('.detail');
      head.addEventListener('click', function(){
        var open = card.classList.toggle('open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open && !detail.dataset.built){ buildDetail(detail, item); detail.dataset.built = '1'; }
      });
    });
  }

  function buildDetail(detail, item){
    var palette = ['#4f46e5','#06b6d4','#f59e0b'];
    var best = bestSource(item);
    var html = '<div class="detail-top"><h3>All tracked outlets</h3><span class="added">Added '+esc(item.date_added||'&#8212;')+'</span></div><div class="sources">';
    item.sources.forEach(function(s, i){
      var win = s.source_id === best.source_id;
      html += ''
        + '<div class="src'+(win?' best':'')+'">'
        +   '<div class="src-head"><div><div class="src-name">'+esc(s.source_name)+(win?' <span class="badge">&#9733; BEST</span>':'')+'</div>'
        +     '<div class="src-fulfil">'+esc(fulfilLabel(s.fulfillment_type))+'</div></div>'
        +     '<a class="buy" href="'+esc(s.product_url)+'" target="_blank" rel="noopener noreferrer">Buy &#8599;</a></div>'
        +   '<div class="breakdown"><span>Base <b>'+fmtAUD(num(s.current_base_price))+'</b></span>'
        +     '<span>Freight <b>'+fmtAUD(num(s.fulfillment_cost))+'</b></span>'
        +     '<span class="tot">'+fmtAUD(num(s.current_total_price))+'</span></div>'
        +   (typeof Chart !== 'undefined'
              ? '<div class="chartbox"><canvas></canvas></div>'
              : '<div class="chart-na">Trend chart unavailable offline</div>')
        + '</div>';
    });
    html += '</div>';
    detail.innerHTML = html;

    if (typeof Chart === 'undefined') return;
    var canvases = detail.querySelectorAll('canvas');
    item.sources.forEach(function(s, i){
      var canvas = canvases[i];
      if (!canvas) return;
      var win = s.source_id === best.source_id;
      var color = win ? '#059669' : palette[i % palette.length];
      var rows = (item.price_history||[]).filter(function(h){ return typeof h[s.source_id] === 'number'; });
      var ctx = canvas.getContext('2d');
      var grad = ctx.createLinearGradient(0,0,0,120);
      grad.addColorStop(0, color+'40'); grad.addColorStop(1, color+'00');
      charts.push(new Chart(ctx, {
        type:'line',
        data:{ labels: rows.map(function(h){return h.date;}),
               datasets:[{ data: rows.map(function(h){return h[s.source_id];}),
                 borderColor:color, backgroundColor:grad, borderWidth:2.4, fill:true, tension:.35,
                 pointRadius:0, pointHoverRadius:5, pointBackgroundColor:color }] },
        options:{ responsive:true, maintainAspectRatio:false, animation:{duration:500},
          interaction:{intersect:false, mode:'index'},
          plugins:{ legend:{display:false},
            tooltip:{ displayColors:false,
              callbacks:{ label:function(c){ return fmtAUD(c.parsed.y); } } } },
          scales:{ x:{ grid:{display:false}, ticks:{ font:{size:9}, maxTicksLimit:6, color:'#94a3b8' } },
                   y:{ grid:{color:'#f1f5f9'}, ticks:{ font:{size:9}, color:'#94a3b8',
                       callback:function(v){ return '$'+v; } } } } }
      }));
    });
  }

  function showError(msg){
    app.innerHTML = '<div class="hero"><div><h1>&#127919; Price Sniper</h1>'
      + '<p>Localised price tracking &#183; Pakenham VIC 3810</p></div></div>'
      + '<div class="state err"><strong>&#9888;&#65039; Couldn&#8217;t load the watchlist.</strong><br>'
      + '<span style="font-size:13px">Expected <code>watchlist.json</code> next to this page. ('+esc(msg)+')</span></div>';
  }

  function start(){
    fetch('./watchlist.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(function(data){ try{ render(data); }catch(e){ showError(e.message); } })
      .catch(function(err){ showError(err.message); });
  }

  // Chart.js loads with `defer`; start once the DOM (and deferred scripts) are ready.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
